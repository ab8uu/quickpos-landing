name: QuickPOS CI/CD Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main

jobs:

  # ═══════════════════════════════════════════════
  # JOB 1 — Jira Commit Message Validation (Stage 10)
  # ═══════════════════════════════════════════════
  validate-commits:
    name: "Jira Commit Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate All Commit Messages Contain Jira ID
        run: |
          echo "Validating commit messages..."
          FAILED=0

          # Get commits that are in HEAD but not in main
          COMMITS=$(git log origin/main..HEAD --format="%H" 2>/dev/null || git log --format="%H" -5)

          if [ -z "$COMMITS" ]; then
            echo "No new commits to validate."
            exit 0
          fi

          for COMMIT in $COMMITS; do
            MSG=$(git log --format="%s" -n 1 "$COMMIT")
            echo "Checking: $MSG"
            if echo "$MSG" | grep -qE '^\[POS-[0-9]+\]'; then
              echo "  ✅ Valid Jira ID found"
            else
              echo "  ❌ MISSING Jira ID. Required format: [POS-123] Your message"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Pipeline failed: One or more commit messages do not contain a valid Jira ticket ID."
            echo "All commits must start with [POS-XXX] e.g. [POS-201] Add contact form tests"
            exit 1
          fi

          echo "All commit messages are valid."

  # ═══════════════════════════════════════════════
  # JOB 2 — Code Quality Check (Stage 3 + Stage 5)
  # Runs IN PARALLEL with Job 3 (Stage 11)
  # ═══════════════════════════════════════════════
  code-quality:
    name: "Code Quality & Syntax Check"
    runs-on: ubuntu-latest
    needs: validate-commits

    steps:
      - name: "Stage 1 – Checkout Code"
        uses: actions/checkout@v4

      - name: "Stage 2 – Setup PHP 8.2"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs, phpstan
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: "Stage 5 – PHP Syntax Check (all .php files)"
        run: |
          echo "Running php -l on all PHP files..."
          FAILED=0
          find . -name "*.php" -not -path "./vendor/*" | while read FILE; do
            RESULT=$(php -l "$FILE" 2>&1)
            if echo "$RESULT" | grep -q "No syntax errors"; then
              echo "  ✅ $FILE"
            else
              echo "  ❌ $FILE — $RESULT"
              FAILED=1
            fi
          done
          echo "Syntax check complete."

      - name: "Stage 3 – PHP CodeSniffer (PSR-12)"
        run: |
          phpcs --standard=PSR12 \
                --extensions=php \
                --ignore=vendor/ \
                --report=summary \
                . || echo "CodeSniffer warnings found (non-blocking)"

      - name: "Upload Code Quality Report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-report
          path: |
            *.php
            tests/*.php

  # ═══════════════════════════════════════════════
  # JOB 3 — Automated Tests (Stage 4 + Stage 7)
  # Runs IN PARALLEL with Job 2 (Stage 11)
  # ═══════════════════════════════════════════════
  run-tests:
    name: "PHPUnit Automated Tests"
    runs-on: ubuntu-latest
    needs: validate-commits

    steps:
      - name: "Stage 1 – Checkout Code"
        uses: actions/checkout@v4

      - name: "Stage 2 – Setup PHP 8.2"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: "Stage 4 – Run PHPUnit Test Suite"
        run: |
          echo "Running PHPUnit tests..."
          ./vendor/bin/phpunit \
            --testdox \
            --log-junit test-results.xml

      - name: "Upload Test Results Artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-test-results
          path: test-results.xml

  # ═══════════════════════════════════════════════
  # JOB 4 — Build & Upload Artifacts (Stage 6)
  # Runs AFTER both parallel jobs succeed
  # ═══════════════════════════════════════════════
  build:
    name: "Build & Upload Artifacts"
    runs-on: ubuntu-latest
    needs: [code-quality, run-tests]

    steps:
      - name: "Stage 1 – Checkout Code"
        uses: actions/checkout@v4

      - name: "Stage 6 – Package Build Files"
        run: |
          mkdir -p build
          # Copy PHP files
          cp *.php build/ 2>/dev/null || true
          # Copy assets if they exist
          [ -d css ]    && cp -r css    build/ || true
          [ -d js ]     && cp -r js     build/ || true
          [ -d images ] && cp -r images build/ || true
          echo "Build contents:"
          ls -la build/

      - name: "Stage 6 – Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: quickpos-build
          path: build/
          retention-days: 7